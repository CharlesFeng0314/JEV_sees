[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-sees"
version = "0.1.0"
description = "Camera facts for JEV: RGB and RGB-D perception, scene memory, and closed questions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Charles Feng" }]
dependencies = [
    "typesafe-sdk>=0.1",
    "numpy",
    "opencv-python",
    "pillow",
    "scipy",
    "scikit-learn",
    "torch",
    "transformers>=4.49,<5",
    "timm",
    "einops",
    "clip @ git+https://github.com/openai/CLIP.git",
    "openpyxl",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["jev_sees*"]
