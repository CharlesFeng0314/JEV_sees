name: Florence smoke

on:
  pull_request:
    paths:
      - pyproject.toml
      - jev_sees/runtime.py
      - jev_sees/perceive.py
      - .github/workflows/florence-smoke.yml
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - jev_sees/runtime.py
      - jev_sees/perceive.py
      - .github/workflows/florence-smoke.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: florence-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_NO_ADVISORY_WARNINGS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache Florence model files
        uses: actions/cache@v6
        with:
          path: .cache/huggingface
          key: ${{ runner.os }}-florence-2-base-ft-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-florence-2-base-ft-

      - name: Install project from scratch
        run: python -m pip install -e .

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Run Florence-2 generation smoke test
        shell: bash
        run: |
          python - <<'PY'
          import numpy as np
          from PIL import Image

          from jev_sees.runtime import VisionRuntime

          image = Image.open("assets/bus.jpg").convert("RGB").resize((256, 256))
          detections = VisionRuntime(device="cpu").detect(np.asarray(image))
          assert isinstance(detections, list)
          print(f"Florence-2 generation completed with {len(detections)} normalized regions")
          PY
